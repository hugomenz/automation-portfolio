<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">AuftragKlar local order-entry workflow</title>
  <desc id="description">A local n8n workflow receives fictitious orders, normalises fields, validates required data, matches fictitious master data and branches to an ERP-ready draft or a human exception record.</desc>
  <style>
    .bg{fill:#111313}.panel{fill:#080909;stroke:#4b4d4b;stroke-width:2}.rule{stroke:#4b4d4b;stroke-width:2;fill:none}.active{stroke:#f0442e;stroke-width:4;fill:none}.review{stroke:#e8bc26;stroke-width:4;fill:none}.text{fill:#f4f1e8;font-family:Arial,sans-serif}.mono{fill:#aaa;font-family:monospace;letter-spacing:2px}.title{font-size:46px;font-weight:700}.node-title{font-size:22px;font-weight:700}.body{font-size:17px;fill:#c9c6bd}.small{font-size:14px}.index{fill:#f0442e;font-family:monospace;font-size:16px;font-weight:700}.dot{fill:#f0442e}.yellow{fill:#e8bc26}.green{fill:#23835c}.red{fill:#f0442e}
  </style>
  <rect class="bg" width="1600" height="720"/>
  <text class="mono small" x="64" y="62">LOCAL N8N · FICTITIOUS DATA · NO CREDENTIALS</text>
  <text class="text title" x="64" y="124">Order entry with an explicit decision boundary</text>
  <line class="rule" x1="64" y1="157" x2="1536" y2="157"/>

  <text class="index" x="64" y="218">01</text>
  <rect class="panel" x="64" y="240" width="250" height="174"/>
  <circle class="dot" cx="92" cy="274" r="6"/>
  <text class="text node-title" x="112" y="282">Receive</text>
  <text class="text body" x="92" y="326">Manual Trigger</text>
  <text class="text body" x="92" y="356">2 synthetic orders</text>
  <text class="mono small" x="92" y="389">NO NETWORK</text>

  <path class="active" d="M314 327H366"/>
  <path class="active" d="M354 317L366 327L354 337"/>

  <text class="index" x="378" y="218">02</text>
  <rect class="panel" x="378" y="240" width="250" height="174"/>
  <circle class="dot" cx="406" cy="274" r="6"/>
  <text class="text node-title" x="426" y="282">Normalise</text>
  <text class="text body" x="406" y="326">Header + line items</text>
  <text class="text body" x="406" y="356">Dates · IDs · quantities</text>
  <text class="mono small" x="406" y="389">ORDER SCHEMA</text>

  <path class="active" d="M628 327H680"/>
  <path class="active" d="M668 317L680 327L668 337"/>

  <text class="index" x="692" y="218">03</text>
  <rect class="panel" x="692" y="240" width="250" height="174"/>
  <circle class="yellow" cx="720" cy="274" r="6"/>
  <text class="text node-title" x="740" y="282">Validate</text>
  <text class="text body" x="720" y="326">Required fields</text>
  <text class="text body" x="720" y="356">Positive quantities</text>
  <text class="mono small" x="720" y="389">DETERMINISTIC</text>

  <path class="active" d="M942 327H994"/>
  <path class="active" d="M982 317L994 327L982 337"/>

  <text class="index" x="1006" y="218">04</text>
  <rect class="panel" x="1006" y="240" width="250" height="174"/>
  <circle class="yellow" cx="1034" cy="274" r="6"/>
  <text class="text node-title" x="1054" y="282">Match masters</text>
  <text class="text body" x="1034" y="326">Customer · article</text>
  <text class="text body" x="1034" y="356">Price · currency</text>
  <text class="mono small" x="1034" y="389">FICTITIOUS DATA</text>

  <path class="active" d="M1256 327H1308"/>
  <path class="active" d="M1296 317L1308 327L1296 337"/>
  <text class="index" x="1320" y="218">05</text>
  <rect class="panel" x="1320" y="240" width="216" height="174"/>
  <circle class="dot" cx="1348" cy="274" r="6"/>
  <text class="text node-title" x="1368" y="282">Route</text>
  <text class="text body" x="1348" y="326">READY</text>
  <text class="text body" x="1348" y="356">or EXCEPTION</text>
  <text class="mono small" x="1348" y="389">IF NODE</text>

  <path class="active" d="M1428 414V468H1116V506"/>
  <path class="active" d="M1106 494L1116 506L1126 494"/>
  <path class="review" d="M1428 414V468H1420V506"/>
  <path class="review" d="M1410 494L1420 506L1430 494"/>

  <rect class="panel" x="1006" y="506" width="250" height="140"/>
  <circle class="green" cx="1034" cy="540" r="6"/>
  <text class="text node-title" x="1054" y="548">ERP-ready draft</text>
  <text class="text body" x="1034" y="590">JSON + CSV</text>
  <text class="mono small" x="1034" y="620">PREPARED · NOT SENT</text>

  <rect class="panel" x="1310" y="506" width="226" height="140"/>
  <circle class="red" cx="1338" cy="540" r="6"/>
  <text class="text node-title" x="1358" y="548">Human review</text>
  <text class="text body" x="1338" y="590">Rule IDs + source</text>
  <text class="mono small" x="1338" y="620">NO AUTO-CORRECTION</text>

  <line class="rule" x1="64" y1="674" x2="1536" y2="674"/>
  <text class="mono small" x="64" y="704">AUDIT ARRAY AT EVERY STEP · NO ERP, CRM, MAILBOX OR MODEL CALL</text>
</svg>
